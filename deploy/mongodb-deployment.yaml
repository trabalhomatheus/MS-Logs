apiVersion: apps/v1
kind: Deployment
metadata:
  name: logsdb
  labels:
    app: logsdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logsdb
  template:
    metadata:
      labels:
        app: logsdb
    spec:
      containers:
        - name: mongodb
          image: mongo:6
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: mongo
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: mongo
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
      volumes:
        - name: mongodb-storage
          emptyDir: {}

